[project]
name = "trazametrica-salud-peru"
version = "0.1.0"
description = "Sistema demostrativo de gestión de procesos, calidad e indicadores para clínicas privadas del Perú."
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django==5.2.17",
    "psycopg[binary]==3.3.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "integration: requiere PostgreSQL",
]

[tool.coverage.run]
branch = true
source = [
    "src/apps/accounts",
    "src/apps/auditlog",
    "src/apps/core",
    "src/apps/documents",
    "src/apps/organizations",
    "src/apps/processes",
    "src/apps/imports",
    "src/apps/indicators",
    "src/apps/audits",
    "src/apps/improvements",
    "src/apps/risks",
]
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"src/apps/accounts/migrations/*.py" = ["E501", "I001"]
"src/apps/organizations/migrations/*.py" = ["E501", "I001"]
"src/apps/auditlog/migrations/*.py" = ["E501", "I001"]
"src/apps/documents/migrations/*.py" = ["E501", "I001"]
"src/apps/processes/migrations/*.py" = ["E501", "I001"]
"src/apps/imports/migrations/*.py" = ["E501", "I001"]
"src/apps/indicators/migrations/*.py" = ["E501", "I001"]
"src/apps/audits/migrations/*.py" = ["E501", "I001"]
"src/apps/improvements/migrations/*.py" = ["E501", "I001"]
"src/apps/risks/migrations/*.py" = ["E501", "I001"]
"src/apps/imports/xlsx.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/apps/(accounts|auditlog|documents|organizations|processes|imports|indicators|audits|improvements|risks)/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.bandit]
exclude_dirs = [
    "tests",
    "src/apps/accounts/migrations",
    "src/apps/organizations/migrations",
    "src/apps/auditlog/migrations",
    "src/apps/documents/migrations",
    "src/apps/processes/migrations",
    "src/apps/imports/migrations",
    "src/apps/indicators/migrations",
    "src/apps/audits/migrations",
    "src/apps/improvements/migrations",
    "src/apps/risks/migrations",
]
