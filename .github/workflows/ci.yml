name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: trazametrica_test
          POSTGRES_USER: trazametrica
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trazametrica -d trazametrica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      ENVIRONMENT: test
      DJANGO_SECRET_KEY: synthetic-ci-secret-key-not-for-any-real-environment
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: trazametrica_test
      DATABASE_USER: trazametrica
      DATABASE_PASSWORD: synthetic-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements/development.txt
      - name: Validate documentation
        run: python scripts/validate_markdown.py
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy src
      - name: Django checks and migrations
        run: |
          python src/manage.py check
          python src/manage.py makemigrations --check --dry-run
          python src/manage.py migrate --noinput
      - name: Tests and coverage
        run: |
          coverage run -m pytest
          coverage report --fail-under=80
      - name: Static security
        run: bandit -c pyproject.toml -r src
      - name: Dependency audit
        run: pip-audit --requirement requirements/production.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag trazametrica-salud:${{ github.sha }} .

